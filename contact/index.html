</head><body id="form-page"><a class="skip-link" href="#main-content">Skip to content</a><div data-shell-header></div><main id="main-content" class="page-width form-page"><header class="form-header"><p class="eyebrow">The newsroom</p><h1>Contact NorthEast News.</h1><p class="form-intro">Use this form for general questions, correction requests and community information. For a story tip, use the dedicated tip form.</p></header><div class="form-layout"><section class="form-card"><form class="nenews-form" data-form-type="contact"><div class="form-field"><label for="contact-name-new">Name</label><input id="contact-name-new" name="name" autocomplete="name" required></div><div class="form-field"><label for="contact-email-new">Email</label><input id="contact-email-new" name="email" type="email" autocomplete="email" required></div><div class="form-field"><label for="contact-type-new">Message type</label><select id="contact-type-new" name="message_type" required><option value="">Choose one</option><option>Correction</option><option>Community information</option><option>General question</option></select></div><div class="form-field"><label for="contact-message-new">Message</label><textarea id="contact-message-new" name="message" required></textarea></div><input class="visually-hidden" tabindex="-1" autocomplete="off" name="_honey"><div class="form-actions"><button class="button-link" type="submit">Send message →</button><small>See our <a href="../privacy/">privacy policy</a>.</small><span class="form-status" data-form-message aria-live="polite"></span></div></form></section><aside class="form-aside"><section><p class="eyebrow">Tips</p><h2>Have a lead?</h2><p><a href="../tips/">Submit a news tip</a> with the location, timing and supporting links.</p></section></aside></div></main><div data-shell-footer></div><script src="../assets/js/shell.js" defer></script><script src="../assets/js/app.js" defer></script><script src="../assets/js/forms.js" defer></script></body></html>
